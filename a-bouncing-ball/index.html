<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <video autoplay muted>
      <source src="Clip with Title.mp4">
    </video>
    <div class="controls">
      <label for="evenness">Even-ness</label>
      <input id="evenness" min="0" max="1" value="0" step=".01" type="range">
      <label for="bias">Speed Bias</label>
      <input id="bias" min="0" max="1" value="0.5" step=".1" type="range">
      <label for="randomness">Randomness</label>
      <input id="randomness" min="0" max="99" value="80" step="1" type="range">
    </div>
  </body>

</html>
